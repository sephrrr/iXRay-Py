[project]
name = "ixraypy"
version = "0.1.0"
description = "Async Python client for the iXRay panel API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "sephrrr" }]
keywords = ["ixray", "proxy", "vpn", "xray", "api", "async"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: AsyncIO",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27", "pydantic>=2.6"]

[project.urls]
Homepage = "https://github.com/sephrrr/iXRay-Py"
Repository = "https://github.com/sephrrr/iXRay-Py"
Issues = "https://github.com/sephrrr/iXRay-Py/issues"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
  "datamodel-code-generator>=0.26",
  "mkdocs-material>=9",
  "mkdocstrings[python]>=0.26",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ixraypy"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["src/ixraypy/models.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/ixraypy/resources/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
